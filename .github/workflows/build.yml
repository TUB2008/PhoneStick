name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The wrapper script is committed without the executable bit in some
      # checkouts, so make it explicit.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # assembleRelease is signed with the keystore and credentials already
      # committed in app/build.gradle, so no repository secrets are required.
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Show build outputs
        run: find app/build/outputs -type f -name '*.apk' -exec ls -l {} +

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneStick-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
